spring.application.name=messaging-app
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/messaging?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USER:messaging}
spring.datasource.password=${DB_PASSWORD:messaging-local}
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.maximum-pool-size=10
spring.flyway.connect-retries=10
spring.jackson.time-zone=UTC
server.error.include-message=never
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.shutdown=graceful
