services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      DB_URL: "jdbc:mysql://db:3306/messaging?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&useSSL=false"
      DB_USER: messaging
      DB_PASSWORD: "${DB_PASSWORD:-messaging-local}"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: messaging
      MYSQL_USER: messaging
      MYSQL_PASSWORD: "${DB_PASSWORD:-messaging-local}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root-local}"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # Check the application account and schema, not only whether mysqld accepts connections.
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

volumes:
  mysql-data:
